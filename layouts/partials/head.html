<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}Welcome to my personal website!{{ else }}{{ .Title }} | {{ site.Params.author }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.author }} - Quantum Computing and Quantum Machine Learning researcher, {{ site.Params.university }}.{{ end }}">
<meta name="author" content="{{ site.Params.author }}">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.1/css/academicons.min.css">

<style type="text/css">
  body {
    padding-top: 60px;
    padding-bottom: 40px;
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
  }
  .sidebar-nav { padding: 9px 0; }
  .border-right { border-right: 1px solid #ddd; }
  .borders { border-left: 1px solid #ddd; border-right: 1px solid #ddd; margin: -1px; }
  .border-left { border-left: 1px solid #ddd; }
  .bs-component { margin-bottom: 18px; }
  h3 { font-size: 20px; font-weight: 700; }
  h4 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; }

  .list-group-item { font-size: 13.5px; }

  .badge-success { background-color: #5cb85c; }
  .badge-info    { background-color: #5bc0de; }
  .badge-warning { background-color: #f0ad4e; }
  .badge-default { background-color: #999; }
  .badge-primary { background-color: #337ab7; }

  /* Education entries */
  .edu-item { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dotted #e5e5e5; }
  .edu-item:last-child { border-bottom: none; }
  .edu-degree { font-weight: 700; }
  .edu-note { color: #777; font-size: 13px; }

  /* Publication entries */
  .pub-item { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dotted #e5e5e5; }
  .pub-item:last-child { border-bottom: none; }
  .pub-title { font-weight: 700; }
  .pub-venue { color: #555; }
  .pub-note { color: #777; font-size: 13px; }

  /* Research / project entries */
  .proj { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px dotted #e5e5e5; }
  .proj:last-child { border-bottom: none; }
  .proj-stack { color: #777; font-size: 13px; font-style: italic; margin-bottom: 6px; }
  .proj ul { padding-left: 18px; }
  .proj li { font-size: 13.5px; margin-bottom: 3px; }

  /* Award entries */
  .aw { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dotted #e5e5e5; }
  .aw:last-child { border-bottom: none; }
  .aw-title { font-weight: 700; }
  .aw-note { color: #777; font-size: 13px; }

  .lede { color: #777; font-size: 13px; }

  footer { margin-top: 30px; }

  @media (max-width: 767px) {
    .col-xs-3, .col-xs-9 { width: 100%; float: none; }
    .border-left { border-left: none; border-top: 1px solid #ddd; padding-top: 15px; }
  }
</style>
